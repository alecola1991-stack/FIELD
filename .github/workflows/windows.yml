name: Windows executable

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bundle local game
        run: npm run build -- --mode desktop
      - name: Prepare verified game update
        run: node desktop/create-update.cjs
      - name: Install desktop tools
        run: npm ci --prefix desktop
      # Code signing as "alecola". With the secrets WINDOWS_CERT_PFX (the .pfx in base64) and
      # WINDOWS_CERT_PASSWORD, that certificate signs (a CA-issued one removes SmartScreen's
      # "unknown publisher"). Without them, a self-signed CN=alecola certificate is made for the
      # build: the signature shows the name but Windows does not trust it.
      - name: Prepare code signing certificate
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'alecola-signing.pfx'
          if ($env:CERT_PFX) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
            $password = $env:CERT_PASSWORD
            "SIGNING_KIND=certificate" >> $env:GITHUB_ENV
          } else {
            $password = [Guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=alecola' -FriendlyName 'alecola' -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(3)
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            "SIGNING_KIND=self-signed" >> $env:GITHUB_ENV
          }
          Write-Output "::add-mask::$password"
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: Build portable and installer
        run: npm run package:win --prefix desktop
      - name: Check signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/release/Futbol-Arcade-*.exe) + @(Get-Item 'desktop/release/win-unpacked/Futbol Arcade.exe')
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Output "$($file.Name): $($signature.Status) · $($signature.SignerCertificate.Subject)"
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=alecola') { throw "Not signed by alecola: $($file.Name)" }
            if ($env:SIGNING_KIND -eq 'certificate' -and $signature.Status -ne 'Valid') { throw "Invalid signature: $($file.Name)" }
          }
      - name: Test packaged game without internet
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/bundled-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/bundled-stderr.log"
          Get-Content "$env:RUNNER_TEMP/bundled-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/bundled-stderr.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Offline game test failed: $($process.ExitCode)" }
      - name: Test downloaded update without internet
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $bundle = Resolve-Path 'desktop/release/game-update.json'
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test --update-package=$bundle" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/updated-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/updated-stderr.log"
          Get-Content "$env:RUNNER_TEMP/updated-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/updated-stderr.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Updated offline game test failed: $($process.ExitCode)" }
      - name: Save Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: Futbol-Arcade-Windows
          path: |
            desktop/release/Futbol-Arcade-Portable-*.exe
            desktop/release/Futbol-Arcade-Setup-*.exe
            desktop/release/game-update.json
      - name: Publish Windows download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Fútbol arcade para Windows' --notes 'Windows de 64 bits. Instalador o Portable. Modos contra la IA disponibles sin internet; online y cuenta requieren conexión. El progreso local de esta aplicación es independiente del navegador. Compilación sin firma digital.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows release' }
          }
          $files = Get-ChildItem desktop/release/Futbol-Arcade-Portable-*.exe, desktop/release/Futbol-Arcade-Setup-*.exe | ForEach-Object { $_.FullName }
          gh release upload windows-latest $files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish executables' }
          gh release upload windows-latest desktop/release/game-update.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish game update' }
      # Only the current version stays in the downloads, so nobody gets an old EXE by mistake.
      - name: Keep only the current version in downloads
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $keep = @("Futbol-Arcade-Portable-$version.exe", "Futbol-Arcade-Setup-$version.exe", 'game-update.json')
          $assets = gh release view windows-latest --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list Windows downloads' }
          foreach ($asset in $assets) {
            if ($keep -notcontains $asset) {
              gh release delete-asset windows-latest $asset --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove old download: $asset" }
            }
          }
          gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --notes 'Windows de 64 bits. Instalador (Futbol-Arcade-Setup: acceso directo, menú Inicio y desinstalación) o Portable (abrir sin instalar). Firmado por alecola. Al abrirse comprueba las actualizaciones del juego en GitHub y aplica la última versión. Desde 1.3.0: inicio de sesión con Google (se abre tu navegador). Modos contra la IA disponibles sin internet; online y cuenta requieren conexión. El progreso local es independiente del navegador.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not update Windows release description' }
      - name: Verify published update download with Electron
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--update-check-test' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/published-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/published-stderr.log"
          Get-Content "$env:RUNNER_TEMP/published-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/published-stderr.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Published GitHub update test failed: $($process.ExitCode)" }

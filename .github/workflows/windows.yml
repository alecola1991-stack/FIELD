name: Windows executable

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bundle local game
        run: npm run build -- --mode desktop
      - name: Prepare verified game update
        run: node desktop/create-update.cjs
      - name: Install desktop tools
        run: npm ci --prefix desktop
      - name: Build portable executable
        run: npm run package:win --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged game without internet
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Offline game test failed: $($process.ExitCode)" }
      - name: Test downloaded update without internet
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $bundle = Resolve-Path 'desktop/release/game-update.json'
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test --update-package=$bundle" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Updated offline game test failed: $($process.ExitCode)" }
      - name: Save Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-Arcade-Windows
          path: |
            desktop/release/Futbol-Arcade-Portable-*.exe
            desktop/release/game-update.json
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Fútbol arcade para Windows' --notes 'Windows de 64 bits. Solo Portable: abrir sin instalar. Modos contra la IA disponibles sin internet; online y cuenta requieren conexión. El progreso local de esta aplicación es independiente del navegador. Compilación sin firma digital.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows release' }
          }
          $files = Get-ChildItem desktop/release/Futbol-Arcade-Portable-*.exe | ForEach-Object { $_.FullName }
          gh release upload windows-latest $files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish executables' }
          gh release upload windows-latest desktop/release/game-update.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish game update' }
      - name: Remove discontinued installers from downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view windows-latest --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list Windows downloads' }
          foreach ($asset in $assets) {
            if ($asset -match '^Futbol-Arcade-Setup-.*\.exe$') {
              gh release delete-asset windows-latest $asset --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove installer: $asset" }
            }
          }
          gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --notes 'Windows de 64 bits. Solo Portable: abrir sin instalar. Desde 1.2.1, una pantalla comprueba las actualizaciones de GitHub antes de abrir el juego y aplica la última versión disponible. Modos contra la IA disponibles sin internet; online y cuenta requieren conexión. El progreso local es independiente del navegador. Compilación sin firma digital.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not update Windows release description' }
      - name: Verify published update download with Electron
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/release/win-unpacked/Futbol Arcade.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--update-check-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published GitHub update test failed: $($process.ExitCode)" }

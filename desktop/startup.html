<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Fútbol arcade · Actualizaciones</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#183329,#0b1115 70%);color:#eafff0;font-family:system-ui,sans-serif;padding:24px}.card{text-align:center;max-width:560px;padding:40px 30px;border:1px solid #65e6a530;border-radius:26px;background:#101c20;box-shadow:0 24px 90px #0005}.brand{font-size:17px;font-weight:800;letter-spacing:.12em;color:#65e6a5;margin:0 0 30px}.spinner{height:64px;width:64px;margin:0 auto 28px;border:4px solid #65e6a525;border-top-color:#65e6a5;border-radius:50%;animation:turn 1s linear infinite}h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 16px}p{font-size:16px;line-height:1.6;color:#b9cbc3;margin:0}small{display:block;margin-top:28px;font-size:13px;color:#83998f}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-color:#65e6a5}}
</style>
</head>
<body><main class="card"><div class="brand">FÚTBOL ARCADE</div><div class="spinner" aria-hidden="true"></div><h1 id="startup-status" role="status" aria-live="polite">Buscando actualizaciones</h1><p id="startup-detail">Comprobando la última versión publicada en GitHub…</p><small>Tu progreso se conserva al actualizar.</small></main></body>
</html>
